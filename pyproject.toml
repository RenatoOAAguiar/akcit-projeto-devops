[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "akcit-devops-genai"
version = "0.1.0"
description = "Laboratório de diagnóstico de falhas em CI/CD com IA generativa"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
devops-lab = "devops_lab.__main__:main"
diagnose-ci = "devops_lab.diagnostics:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["devops_lab"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

