name: Revisao de pull request

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  review:
    name: Master of Merges
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Executa SOMENTE o revisor da base; código da PR é obtido como dados pela API.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Avaliar alteracoes da PR
        id: review
        env:
          PYTHONUTF8: "1"
          PYTHONPATH: src
          GITHUB_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.openai.com/v1' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4.1-mini' }}
          REQUIRE_GENAI: ${{ vars.REQUIRE_GENAI || 'false' }}
        shell: bash
        run: |
          mode=auto
          if [ "$REQUIRE_GENAI" = "true" ]; then mode=llm; fi
          python -m devops_lab.pr_review --event "$GITHUB_EVENT_PATH" --mode "$mode"
      - name: Resumo da revisao
        if: always() && hashFiles('reports/review/review.md') != ''
        shell: bash
        run: cat reports/review/review.md >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar parecer
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: master-of-merges-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/review/
          retention-days: 30
          if-no-files-found: error
      - name: Comentar parecer na PR
        if: >-
          always() && hashFiles('reports/review/review.md') != '' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('reports/review/review.md', 'utf8');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: report.replace(/@/g, '＠').slice(0, 50000) + `\n\nExecução: ${runUrl}`,
            });
